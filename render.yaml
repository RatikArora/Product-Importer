services:
  # Web Service with integrated worker
  - type: web
    name: fulfil-product-importer
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash start-production.sh
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fulfil-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: fulfil-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CHUNK_SIZE
        value: "500"
      - key: MAX_FILE_SIZE
        value: "104857600"
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: fulfil-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: fulfil-redis
          property: connectionString

  # Redis Service
  - type: redis
    name: fulfil-redis
    plan: free
    ipAllowList: []

databases:
  - name: fulfil-db
    databaseName: fulfil_products
    user: fulfil_user
    plan: free